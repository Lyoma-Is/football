<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=800">
  <meta name="theme-color" content="#eaf2ff">
  <title>Футбольный клуб</title>
  <style>
    :root {
      --bg-1: #eaf2ff;
      --bg-2: #ffffff;
      --bg-3: #dfeaff;
      --card: #ffffff;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --blue-deep: #1e3a8a;
      --blue-soft: #eaf2ff;
      --blue-line: #cfe0fb;
      --blue-line-strong: #93b4f0;
      --text: #12284f;
      --muted: #5f7399;
      --plus: #27ae60;
      --plus-line: #2ecc71;
      --minus: #c0392b;
      --minus-line: #e74c3c;
      --shadow: 0 8px 28px rgba(37, 99, 235, 0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; overflow-x: hidden; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 48%, var(--bg-3) 100%);
      background-attachment: fixed;
      min-height: 100vh;
      min-height: 100dvh;
      color: var(--text);
      padding: 12px;
    }
    .container { width: 100%; max-width: 800px; margin: 0 auto; }

    header {
      text-align: center;
      margin-bottom: 16px;
      padding: 14px 12px;
      background: linear-gradient(135deg, #ffffff 0%, #eef4ff 100%);
      border-radius: 14px;
      border: 2px solid var(--blue-line);
      border-top: 4px solid var(--blue);
      box-shadow: var(--shadow);
    }
    #clubTitle {
      font-size: clamp(1.25rem, 5.5vw, 2.2rem);
      margin-bottom: 6px;
      outline: none;
      border: none;
      background: transparent;
      color: var(--blue-deep);
      text-align: center;
      width: 100%;
      font-weight: 700;
      font-family: inherit;
      border-radius: 8px;
      padding: 4px 6px;
    }
    body:not(.admin) #clubTitle { pointer-events: none; cursor: default; }
    body.admin #clubTitle { cursor: text; }
    body.admin #clubTitle:hover { background: rgba(37, 99, 235, 0.06); }
    body.admin #clubTitle:focus {
      background: #fff;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.35);
    }
    .subtitle { color: var(--muted); font-size: 0.9rem; }

    .controls {
      display: none;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }
    body.admin .controls { display: flex; }

    input[type="text"], input[type="password"], input[type="email"] {
      flex: 1 1 140px;
      min-width: 0;
      padding: 12px 14px;
      border: 2px solid var(--blue-line-strong);
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      font-size: 16px;
      outline: none;
    }
    input::placeholder { color: rgba(18, 40, 79, 0.4); }
    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    button:hover { transform: translateY(-2px); }
    button:active { transform: translateY(0); }

    .btn-add {
      background: var(--blue);
      color: #fff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
      flex: 0 0 auto;
      white-space: nowrap;
    }
    .btn-add:hover { background: var(--blue-dark); }
    .btn-add.btn-add-col {
      background: #fff;
      color: var(--blue);
      border: 2px solid var(--blue);
      box-shadow: none;
    }
    .btn-add.btn-add-col:hover { background: var(--blue-soft); }
    .col-del {
      display: block;
      margin: 2px auto 0;
      padding: 0 8px;
      background: transparent;
      color: #9db0d0;
      font-size: 0.8rem;
      border-radius: 6px;
    }
    .col-del:hover { color: #e74c3c; background: rgba(231, 76, 60, 0.12); transform: none; }
    .btn-save {
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      color: #fff;
      box-shadow: 0 4px 14px rgba(29, 78, 216, 0.35);
      width: 100%;
      max-width: 320px;
      margin: 0 auto;
      display: none;
      padding: 14px 20px;
      font-size: 1.05rem;
    }
    body.admin .btn-save { display: block; }
    .btn-save:hover { background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); }
    .btn-export {
      background: #fff;
      color: var(--blue-dark);
      border: 2px solid var(--blue);
      width: 100%;
      max-width: 320px;
      margin: 0 auto;
      display: none;
      padding: 12px 20px;
      font-size: 1rem;
    }
    body.admin .btn-export { display: block; }
    .btn-export:hover { background: var(--blue-soft); }
    .btn-export:disabled { opacity: 0.6; cursor: default; transform: none; }

    .table-wrapper {
      background: var(--card);
      border-radius: 14px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border: 2px solid var(--blue-line);
      box-shadow: var(--shadow);
      width: 100%;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    thead { background: var(--blue-soft); }
    th {
      padding: 12px 8px;
      text-align: left;
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 0.3px;
      white-space: nowrap;
      color: var(--blue-deep);
    }
    th.th-num { width: 44px; text-align: center; }
    th.th-name { width: auto; }
    th.th-period { text-align: center; }
    th.th-col { width: 76px; text-align: center; padding: 6px 4px; border-left: 1px solid var(--blue-line); }
    thead tr + tr th { border-top: 1px solid var(--blue-line); }
    .th-period .status-title-input { width: 260px; max-width: 100%; }
    input.col-title-input {
      flex: none;
      width: 100%;
      padding: 4px 2px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: var(--blue-deep);
      font-size: 0.85rem;
      font-weight: 600;
      font-family: inherit;
      text-align: center;
      box-shadow: none;
    }
    body.admin input.col-title-input:hover { background: rgba(37, 99, 235, 0.08); }
    body.admin input.col-title-input:focus { background: #fff; border-color: var(--blue); box-shadow: none; }
    .col-title-text { font-size: 0.85rem; font-weight: 600; }
    th.th-del { width: 40px; text-align: center; }
    body:not(.admin) th.th-del { display: none; }

    .status-title-input {
      width: 140px;
      max-width: 140px;
      padding: 4px 6px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: var(--blue-deep);
      font-size: 0.85rem;
      font-weight: 600;
      font-family: inherit;
      text-align: center;
      outline: none;
      box-shadow: none;
    }
    body:not(.admin) .status-title-input { pointer-events: none; border: none; }
    body.admin .status-title-input { cursor: text; }
    body.admin .status-title-input:hover { background: rgba(37, 99, 235, 0.08); }
    body.admin .status-title-input:focus {
      background: #fff;
      border-color: var(--blue);
      box-shadow: none;
    }
    .status-title-text {
      display: none;
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
    }
    body:not(.admin) .status-title-text { display: inline; }
    body:not(.admin) .status-title-input { display: none; }

    td {
      padding: 10px 8px;
      border-top: 1px solid #e3ecfb;
      vertical-align: middle;
    }
    td.td-num {
      text-align: center;
      font-weight: 600;
      color: var(--blue);
      font-size: 0.9rem;
    }
    td.td-status, td.td-del { text-align: center; }
    td.td-status { border-left: 1px solid #e3ecfb; padding-left: 4px; padding-right: 4px; }
    body:not(.admin) td.td-del { display: none; }

    .name-cell {
      display: flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }
    .name-text {
      flex: 1;
      min-width: 0;
      white-space: normal;
      overflow-wrap: anywhere;
      font-size: 1.2rem;
    }
    .name-edit-input {
      flex: 1;
      min-width: 0;
      width: 100%;
      padding: 6px 8px;
      border: 2px solid var(--blue);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      font-size: 16px;
      font-family: inherit;
      outline: none;
    }
    .edit-btn {
      background: transparent;
      border: none;
      color: #8aa2cc;
      font-size: 0.95rem;
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      flex-shrink: 0;
    }
    body:not(.admin) .edit-btn { display: none !important; }
    .edit-btn:hover { color: var(--blue); background: rgba(37, 99, 235, 0.1); }

    .status-input {
      width: 44px;
      height: 36px;
      text-align: center;
      text-align-last: center;
      font-size: 1.2rem;
      font-weight: 700;
      font-family: inherit;
      border: 2px solid var(--blue-line-strong);
      border-radius: 8px;
      background: var(--blue-soft);
      color: var(--blue-deep);
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      cursor: pointer;
      padding: 0 2px;
    }
    .status-input option {
      color: #000;
      font-weight: 700;
    }
    .status-input.plus {
      background: var(--plus);
      border-color: var(--plus-line);
      color: #fff;
    }
    .status-input.minus {
      background: var(--minus);
      border-color: var(--minus-line);
      color: #fff;
    }
    body.admin .status-input:focus {
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
    }

    .status-badge {
      display: none;
      width: 44px;
      height: 36px;
      min-height: 36px;
      margin: 0 auto;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: 700;
      border-radius: 8px;
      box-sizing: border-box;
    }
    body:not(.admin) .status-input { display: none; }
    body:not(.admin) .status-badge { display: inline-flex; }
    .status-badge.plus { background: var(--plus); color: #fff; }
    .status-badge.minus { background: var(--minus); color: #fff; }
    .status-badge.empty {
      background: #edf2fb;
      color: #9db0d0;
      height: 36px;
      min-height: 36px;
    }

    .empty {
      text-align: center;
      padding: 16px;
      color: var(--muted);
      font-size: 1rem;
    }
    .delete-btn {
      background: transparent;
      border: none;
      color: #9db0d0;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
    }
    body:not(.admin) .delete-btn { display: none !important; }
    .delete-btn:hover { color: #e74c3c; background: rgba(231, 76, 60, 0.12); }
    tr:hover td { background: #f5f9ff; }

    .save-section {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
    }
    .slider-wrap {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .slider-arrow {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid var(--blue-line-strong);
      background: #fff;
      color: var(--blue);
      font-size: 1.15rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .slider-arrow:hover {
      background: var(--blue-soft);
      border-color: var(--blue);
      transform: none;
    }
    .slider-arrow:disabled { opacity: 0.35; cursor: default; }
    .slider-track {
      flex: 1;
      min-width: 0;
      overflow-x: auto;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding: 6px 0;
    }
    .slider-track::-webkit-scrollbar { display: none; }
    .slider-inner {
      display: flex;
      gap: 8px;
      width: max-content;
      min-height: 40px;
      align-items: center;
    }
    .period-btn {
      flex-shrink: 0;
      padding: 10px 14px;
      border-radius: 10px;
      border: 2px solid var(--blue-line-strong);
      background: #fff;
      color: var(--blue-dark);
      font-size: 0.9rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
    }
    .period-btn:hover {
      background: var(--blue-soft);
      border-color: var(--blue);
      transform: translateY(-2px);
    }
    .period-btn.active {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
    .period-btn .period-del {
      margin-left: 6px;
      opacity: 0.6;
      font-size: 0.85rem;
    }
    body:not(.admin) .period-btn .period-del { display: none; }
    .period-btn .period-del:hover { opacity: 1; color: #e74c3c; }
    .slider-hint {
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
      padding: 0 8px;
    }

    .admin-bar {
      margin-top: 20px;
      text-align: center;
    }
    .admin-link {
      background: transparent;
      border: 1px solid var(--blue-line-strong);
      color: #6f84ab;
      font-size: 0.8rem;
      padding: 8px 14px;
      border-radius: 8px;
    }
    .admin-link:hover {
      color: var(--blue);
      border-color: var(--blue);
      transform: none;
    }
    body.admin .admin-link {
      border-color: var(--blue);
      color: var(--blue);
    }

    .sync-status {
      display: none;
    }
    footer {
      display: none;
    }

    #toastContainer {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
      width: min(400px, calc(100% - 24px));
    }
    .toast {
      pointer-events: auto;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: 0 8px 28px rgba(18, 40, 79, 0.18);
      animation: toastIn 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toast.hide { animation: toastOut 0.25s ease forwards; }
    .toast.info { background: #eff6ff; border: 1px solid #3b82f6; color: #1e3a8a; }
    .toast.success { background: #ecfdf5; border: 1px solid #22c55e; color: #166534; }
    .toast.warn { background: #fffbeb; border: 1px solid #f59e0b; color: #92400e; }
    .toast.error { background: #fef2f2; border: 1px solid #ef4444; color: #991b1b; }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes toastOut {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 0; transform: translateY(-12px); }
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(18, 40, 79, 0.45);
      z-index: 10000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .overlay.show { display: flex; }
    .modal-box {
      background: #fff;
      border: 2px solid var(--blue-line);
      border-top: 4px solid var(--blue);
      border-radius: 16px;
      padding: 20px;
      max-width: 340px;
      width: 100%;
      box-shadow: 0 16px 48px rgba(18, 40, 79, 0.25);
      text-align: center;
      color: var(--text);
    }
    .modal-box p {
      font-size: 1rem;
      margin-bottom: 14px;
      line-height: 1.4;
    }
    .modal-box input { width: 100%; margin-bottom: 14px; }
    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .modal-actions button { min-width: 90px; flex: 1; }
    .btn-confirm-yes { background: #e74c3c; color: #fff; }
    .btn-confirm-yes:hover { background: #c0392b; }
    .btn-ok { background: var(--blue); color: #fff; }
    .btn-ok:hover { background: var(--blue-dark); }
    .btn-confirm-no {
      background: #eef2fb;
      color: var(--text);
      border: 1px solid var(--blue-line);
    }
    .btn-confirm-no:hover { background: var(--blue-soft); }

    .name-actions {
      display: none;
      flex-direction: row;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      margin-top: 10px;
      min-width: 40%;
      flex-wrap: nowrap;

    }

    .period-title-mobile-input { display: none; }
  </style>
</head>
<body>
  <div id="toastContainer"></div>

  <div id="confirmOverlay" class="overlay">
    <div class="modal-box">
      <p id="confirmText"></p>
      <div class="modal-actions">
        <button class="btn-confirm-no" id="confirmNo">Отмена</button>
        <button class="btn-confirm-yes" id="confirmYes">Удалить</button>
      </div>
    </div>
  </div>

  <div id="loginOverlay" class="overlay">
    <div class="modal-box">
      <p>Вход для администратора</p>
      <input type="email" id="adminLogin" placeholder="Email" maxlength="80" autocomplete="username">
      <input type="password" id="adminPassword" placeholder="Пароль" maxlength="80" autocomplete="current-password">
      <div class="modal-actions">
        <button class="btn-confirm-no" id="loginCancel">Отмена</button>
        <button class="btn-ok" id="loginOk">Войти</button>
      </div>
    </div>
  </div>

  <div class="container">
    <header>
      <input type="text" id="clubTitle" value="⚽ Футбольный клуб" maxlength="60" spellcheck="false">
    </header>

    <div class="controls">
      <input type="text" id="playerName" placeholder="Введите ФИО игрока..." maxlength="80">
      <button class="btn-add" onclick="addPlayer()">➕ Добавить игрока</button>
      <button class="btn-add btn-add-col" onclick="addColumn()">➕ Добавить столбец</button>
    </div>

    <div class="table-wrapper">
      <table>
        <colgroup id="colGroup"></colgroup>
        <thead>
          <tr id="tableHead"></tr>
          <tr id="tableHead2"></tr>
        </thead>
        <tbody id="playerList"></tbody>
      </table>
      <div id="emptyMessage" class="empty">Загрузка...</div>
    </div>

    <div class="save-section">
      <input type="text" id="periodTitleMobile" class="period-title-mobile-input" placeholder="Месяц Год" maxlength="30" autocomplete="off">
      <button class="btn-save" id="saveBtn" onclick="savePeriod(true)">💾 Сохранить</button>
      <button class="btn-export" id="exportBtn" onclick="exportDocx()">📄 Выгрузить в .docx</button>
      <div class="slider-wrap">
        <button class="slider-arrow" id="sliderLeft" onclick="scrollSlider(-1)" title="Назад">◀</button>
        <div class="slider-track" id="sliderTrack">
          <div class="slider-inner" id="sliderInner"></div>
        </div>
        <button class="slider-arrow" id="sliderRight" onclick="scrollSlider(1)" title="Вперёд">▶</button>
      </div>
      <p class="slider-hint" id="sliderHint">Сохранённые периоды появятся здесь</p>
    </div>

    <div class="admin-bar">
      <button class="admin-link" id="adminBtn" onclick="toggleAdmin()"></button>
      <div class="sync-status" id="syncStatus">Подключение...</div>
    </div>

    <footer id="footerText">Режим просмотра</footer>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCxyXhe2NJ0DlzaPAJWw2hpB1MI0fMPRQ4",
      authDomain: "footbool-144c5.firebaseapp.com",
      databaseURL: "https://footbool-144c5-default-rtdb.firebaseio.com",
      projectId: "footbool-144c5",
      storageBucket: "footbool-144c5.firebasestorage.app",
      messagingSenderId: "526579285005",
      appId: "1:526579285005:web:a488fe3588cebcff682944"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app);
    const dataRef = ref(db, "content");

    let players = [];
    let statusTitle = "";
    let periods = [];
    let activePeriodId = null;
    let clubTitleValue = "⚽ Футбольный клуб";
    let isAdmin = false;
    let confirmCallback = null;
    let saveTimer = null;
    let applyingRemote = false;
    let ready = false;
    let firebaseUser = null;

    const MIN_COLS = 1;
    const MAX_COLS = 12;
    let colCount = 6;
    const clampCols = (n) =>
      Math.min(MAX_COLS, Math.max(MIN_COLS, parseInt(n, 10) || 6));
    const emptyMarks = (n = colCount) => Array(n).fill("");
    const emptyTitles = (n = colCount) => Array(n).fill("");
    let colTitles = emptyTitles();
    function normMarks(m, n = colCount) {
      const out = emptyMarks(n);
      if (Array.isArray(m)) {
        m.slice(0, n).forEach((v, i) => {
          out[i] = v === "+" || v === "-" ? v : "";
        });
      } else if (m === "+" || m === "-") {
        out[0] = m; // старые данные: один статус -> первый столбец
      }
      return out;
    }
    function normTitles(t, n = colCount) {
      const out = emptyTitles(n);
      if (Array.isArray(t)) {
        t.slice(0, n).forEach((v, i) => {
          out[i] = typeof v === "string" ? v : "";
        });
      }
      return out;
    }

    function uid() {
      return "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    }

    function getState() {
      return {
        clubTitle: clubTitleValue,
        statusTitle,
        colCount,
        colTitles,
        players: players.map((p) => ({ id: p.id, name: p.name, marks: p.marks })),
        periods,
        activePeriodId: activePeriodId || null
      };
    }

    function applyState(data) {
      if (!data || typeof data !== "object") {
        players = [];
        periods = [];
        statusTitle = "";
        colTitles = emptyTitles();
        activePeriodId = null;
        return;
      }
      clubTitleValue = data.clubTitle || "⚽";
      statusTitle = data.statusTitle || "";
      colCount = clampCols(data.colCount);
      colTitles = normTitles(data.colTitles);
      players = Array.isArray(data.players)
        ? data.players.map((p) => ({
            id: p.id || uid(),
            name: p.name || "",
            marks: normMarks(p.marks !== undefined ? p.marks : p.status)
          }))
        : [];
      periods = Array.isArray(data.periods) ? data.periods : [];
      activePeriodId = data.activePeriodId || null;

      const titleInput = document.getElementById("clubTitle");
      titleInput.value = clubTitleValue;
      document.title = clubTitleValue.replace(/^⚽\s*/, "") || "Футбольный клуб";
    }

    function setSyncStatus(text, cls) {
      const el = document.getElementById("syncStatus");
      el.textContent = text;
      el.className = "sync-status" + (cls ? " " + cls : "");
    }

    function scheduleSave() {
      if (!isAdmin || !ready) return;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(async () => {
        try {
          applyingRemote = true;
          await set(dataRef, getState());
          setSyncStatus("Сохранено в Firebase", "ok");
        } catch (e) {
          setSyncStatus("Ошибка записи — проверьте Rules", "err");
          showToast("Нет доступа на запись в Firebase", "error");
          console.warn(e);
        } finally {
          setTimeout(() => {
            applyingRemote = false;
          }, 300);
        }
      }, 350);
    }

    onValue(
      dataRef,
      (snapshot) => {
        if (applyingRemote && isAdmin) return;
        applyState(snapshot.val());
        sortPlayers();
        ready = true;
        render();
        /* status hidden */
      },
      (err) => {
        ready = true;
        setSyncStatus("Нет чтения — настройте Rules", "err");
        showToast("Нет доступа к базе. Откройте Rules (read)", "error");
        console.warn(err);
        render();
      }
    );

    onAuthStateChanged(auth, (user) => {
      firebaseUser = user;
      if (user) {
        isAdmin = true;
        applyAdminMode();
        render();
        /* status hidden */
      }
    });

    function applyAdminMode() {
      document.body.classList.toggle("admin", isAdmin);
      const btn = document.getElementById("adminBtn");
      if (isAdmin) {
        btn.textContent = "Выйти из админ-режима";
      } else {
        btn.textContent = "Вход для администратора";
      }
    }

    window.toggleAdmin = async function () {
      if (isAdmin) {
        try {
          await signOut(auth);
        } catch (_) {}
        isAdmin = false;
        firebaseUser = null;
        applyAdminMode();
        render();
        showToast("Вы вышли из режима администратора", "info");
      } else {
        document.getElementById("adminLogin").value = "";
        document.getElementById("adminPassword").value = "";
        document.getElementById("loginOverlay").classList.add("show");
        setTimeout(() => document.getElementById("adminLogin").focus(), 100);
      }

    async function tryLogin() {
      const login = document.getElementById("adminLogin").value.trim();
      const pass = document.getElementById("adminPassword").value;
      if (!login || !pass) {
        showToast("Введите email и пароль", "warn");
        return;
      }

      // Вход только через Firebase Auth — никаких локальных запасных паролей в клиентском коде
      try {
        const cred = await signInWithEmailAndPassword(auth, login, pass);
        isAdmin = true;
        firebaseUser = cred.user;
        document.getElementById("loginOverlay").classList.remove("show");
        applyAdminMode();
        render();
        showToast("Вход выполнен", "success");
        return;
      } catch (e) {
        console.warn("Firebase Auth:", e.code || e.message);
      }

      showToast("Неверный email или пароль", "error");
      document.getElementById("adminPassword").value = "";
      document.getElementById("adminLogin").focus();
    }

    function isDefaultTitle(t) {
      const s = (t || "").trim();
      return !s || s === "+ / −" || s === "+/-" || s === "+/−";
    }

    function snapshotCurrent() {
      const title = (statusTitle || "").trim();
      if (isDefaultTitle(title) || players.length === 0) return null;
      const statuses = {};
      players.forEach((p) => {
        statuses[p.id] = p.marks.slice();
      });
      const existing = periods.find((pr) => pr.title === title);
      if (existing) {
        existing.statuses = statuses;
        existing.colTitles = colTitles.slice();
        existing.cols = colCount;
        return existing.id;
      }
      const period = { id: uid(), title, statuses, colTitles: colTitles.slice(), cols: colCount };
      periods.push(period);
      return period.id;
    }

    window.savePeriod = function (clearAfter) {
      if (!isAdmin) return;
      const title = (statusTitle || "").trim();
      if (isDefaultTitle(title)) {
        showToast(
          "Введите название периода (например: Октябрь 2026)",
          "warn"
        );

      if (players.length === 0) {
        showToast("Нет игроков для сохранения", "warn");

      if (clearAfter) {

        colTitles = emptyTitles();
        activePeriodId = null;

    function loadPeriod(periodId) {
      const period = periods.find((p) => p.id === periodId);
      if (!period) return;
      if (period.id === activePeriodId) return;

      if (isAdmin) {
        const currentTitle = (statusTitle || "").trim();
        if (!isDefaultTitle(currentTitle) && currentTitle !== period.title) {
          snapshotCurrent();
        }
      }

      statusTitle = period.title;
      colCount = clampCols(period.cols || 6);
      players.forEach((p) => {
        p.marks = normMarks(period.statuses ? period.statuses[p.id] : undefined);
      });
      colTitles = normTitles(period.colTitles);
      activePeriodId = periodId;
      if (isAdmin) scheduleSave();
      render();
      showToast("Открыт период «" + period.title + "»", "info");

    function startEdit(player, nameCell, nameText, editBtn) {
      if (!isAdmin) return;
      const input = document.createElement("input");
      input.type = "text";
      input.className = "name-edit-input";
      input.value = player.name;
      input.maxLength = 80;
      nameCell.replaceChild(input, nameText);
      if (editBtn) editBtn.style.display = "none";
      input.focus();
      input.select();
      const finish = () => {
        const newName = input.value.trim();
        if (newName && newName !== player.name) {
          player.name = newName;
          sortPlayers();
          scheduleSave();
          render();
        } else {
          nameCell.replaceChild(nameText, input);
          if (editBtn) editBtn.style.display = "";
        }
      };
      input.addEventListener("blur", finish);
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          input.blur();
        }
        if (e.key === "Escape") {
          input.value = player.name;
          input.blur();
        }
      });
    }

    function createStatusSelect(p, idx) {
      const select = document.createElement("select");
      select.className = "status-input";
      const options = [
        { value: "", label: "—" },
        { value: "+", label: "+" },
        { value: "-", label: "−" }
      ];
      options.forEach((o) => {
        const opt = document.createElement("option");
        opt.value = o.value;
        opt.textContent = o.label;
        select.appendChild(opt);
      });
      select.value = p.marks[idx] || "";
      updateStatusClass(select);
      bindStatusInput(select, p, idx);
      return select;
    }

    function bindStatusInput(select, p, idx) {
      select.addEventListener("change", (e) => {
        if (!isAdmin) return;
        const v = e.target.value === "+" || e.target.value === "-" ? e.target.value : "";
        p.marks[idx] = v;
        updateStatusClass(e.target);
        activePeriodId = null;
        scheduleSave();
        renderPeriods();
      });
    }

    function updateStatusClass(input) {
      input.classList.remove("plus", "minus");
      if (input.value === "+") input.classList.add("plus");
      else if (input.value === "-") input.classList.add("minus");
    }

    window.addColumn = function () {
      if (!isAdmin) return;
      if (colCount >= MAX_COLS) {
        showToast("Максимум столбцов: " + MAX_COLS, "warn");
        return;

      colCount++;
      players.forEach((p) => p.marks.push(""));
      colTitles.push("");
      activePeriodId = null;
      scheduleSave();
      render();
    };

    function removeColumn(idx) {
      if (!isAdmin || colCount <= MIN_COLS) return;
      const name = (colTitles[idx] || "").trim() || String(idx + 1);
      showConfirm("Удалить столбец «" + name + "» вместе с отметками?", () => {
        colCount--;
        players.forEach((p) => p.marks.splice(idx, 1));

        scheduleSave();

        showToast("Столбец удалён", "info");

    window.addPlayer = function () {
      if (!isAdmin) return;
      const input = document.getElementById("playerName");
      const name = input.value.trim();
      if (!name) {

      input.value = "";
      scheduleSave();
      render();
      input.focus();

    document.getElementById("playerName").addEventListener("keydown", (e) => {

    /* ---------- Выгрузка в .docx (без внешних библиотек) ---------- */
    const CRC_TABLE = (() => {
      const t = new Uint32Array(256);
      for (let n = 0; n < 256; n++) {
        let c = n;
        for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
        t[n] = c >>> 0;
      }
      return t;
    })();
    function crc32(bytes) {
      let c = 0xffffffff;
      for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
      return (c ^ 0xffffffff) >>> 0;
    }
    // Простейший ZIP без сжатия (метод "store") — Word такие файлы открывает
    function makeZip(files) {
      const enc = new TextEncoder();
      const d = new Date();
      const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
      const dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
      const chunks = [];
      const central = [];
      let offset = 0;
      files.forEach((f) => {
        const name = enc.encode(f.name);
        const data = enc.encode(f.content);
        const crc = crc32(data);
        const lh = new DataView(new ArrayBuffer(30));
        lh.setUint32(0, 0x04034b50, true);
        lh.setUint16(4, 20, true);
        lh.setUint16(6, 0x0800, true);
        lh.setUint16(8, 0, true);
        lh.setUint16(10, dosTime, true);
        lh.setUint16(12, dosDate, true);
        lh.setUint32(14, crc, true);
        lh.setUint32(18, data.length, true);
        lh.setUint32(22, data.length, true);
        lh.setUint16(26, name.length, true);
        lh.setUint16(28, 0, true);
        chunks.push(new Uint8Array(lh.buffer), name, data);

        const ch = new DataView(new ArrayBuffer(46));
        ch.setUint32(0, 0x02014b50, true);
        ch.setUint16(4, 20, true);
        ch.setUint16(6, 20, true);
        ch.setUint16(8, 0x0800, true);
        ch.setUint16(10, 0, true);
        ch.setUint16(12, dosTime, true);
        ch.setUint16(14, dosDate, true);
        ch.setUint32(16, crc, true);
        ch.setUint32(20, data.length, true);
        ch.setUint32(24, data.length, true);
        ch.setUint16(28, name.length, true);
        ch.setUint32(42, offset, true);
        central.push(new Uint8Array(ch.buffer), name);
        offset += 30 + name.length + data.length;
      });
      let centralSize = 0;
      central.forEach((c) => (centralSize += c.length));
      const end = new DataView(new ArrayBuffer(22));
      end.setUint32(0, 0x06054b50, true);
      end.setUint16(8, files.length, true);
      end.setUint16(10, files.length, true);
      end.setUint32(12, centralSize, true);
      end.setUint32(16, offset, true);
      return new Blob(chunks.concat(central, [new Uint8Array(end.buffer)]), {
        type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
      });
    }

    function xmlEsc(t) {
      return String(t)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
    function wRun(text, o = {}) {
      if (text === "") return "";
      return (
        "<w:r><w:rPr>" +
        '<w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/>' +
        (o.bold ? "<w:b/>" : "") +
        '<w:color w:val="' + (o.color || "12284F") + '"/>' +
        '<w:sz w:val="' + (o.size || 22) + '"/>' +
        '</w:rPr><w:t xml:space="preserve">' + xmlEsc(text) + "</w:t></w:r>"
      );
    }
    function wPara(text, o = {}) {
      return (
        "<w:p><w:pPr>" +
        (o.after != null ? '<w:spacing w:after="' + o.after + '"/>' : "") +
        '<w:jc w:val="' + (o.left ? "left" : "center") + '"/></w:pPr>' +
        wRun(text, o) +
        "</w:p>"
      );
    }
    function wCell(text, w, o = {}) {
      return (
        "<w:tc><w:tcPr>" +
        '<w:tcW w:w="' + w + '" w:type="dxa"/>' +
        (o.fill ? '<w:shd w:val="clear" w:color="auto" w:fill="' + o.fill + '"/>' : "") +
        '<w:vAlign w:val="center"/></w:tcPr>' +
        wPara(text, o) +
        "</w:tc>"
      );
    }

    window.exportDocx = function () {
      if (!isAdmin) return;
      if (players.length === 0) {
        showToast("Нет игроков для выгрузки", "warn");
        return;
      }
      try {
        const clubName = (clubTitleValue || "").replace(/^⚽\s*/, "").trim() || "Футбольный клуб";
        const periodName = isDefaultTitle(statusTitle) ? "" : statusTitle.trim();

        // 1 см = 567 twips: ФИО — 6 см, столбцы отметок — 2 см
        const margin = 720;
        const numW = 600;
        const nameW = 3402;
        let markW = 1134;
        let contentW = numW + nameW + markW * colCount;
        const landscape = contentW > 11906 - margin * 2;
        const pageW = landscape ? 16838 : 11906;
        const pageH = landscape ? 11906 : 16838;
        const avail = pageW - margin * 2;
        if (contentW > avail) {
          // очень много столбцов: чуть сужаем их, чтобы таблица поместилась на странице
          markW = Math.floor((avail - numW - nameW) / colCount);
          contentW = numW + nameW + markW * colCount;
        }
        const widths = [numW, nameW].concat(Array(colCount).fill(markW));

        const head = { bold: true, fill: "EAF2FF", color: "1E3A8A" };
        let rows =
          "<w:tr><w:trPr><w:cantSplit/><w:tblHeader/></w:trPr>" +
          wCell("№", widths[0], head) +
          wCell("ФИО", widths[1], Object.assign({ left: true }, head));
        for (let c = 0; c < colCount; c++) {
          rows += wCell((colTitles[c] || "").trim() || String(c + 1), markW, Object.assign({ size: 20 }, head));
        }
        rows += "</w:tr>";

        players.forEach((p, i) => {
          rows +=
            "<w:tr><w:trPr><w:cantSplit/></w:trPr>" +
            wCell(String(i + 1), widths[0], { bold: true, color: "2563EB" }) +
            wCell(p.name, widths[1], { left: true });
          for (let c = 0; c < colCount; c++) {
            const v = p.marks[c];
            if (v === "+") rows += wCell("+", markW, { bold: true });
            else if (v === "-") rows += wCell("−", markW, { fill: "C0392B", color: "FFFFFF", bold: true });
            else rows += wCell("", markW);
          }
          rows += "</w:tr>";
        });

        const border = (n) => "<w:" + n + ' w:val="single" w:sz="4" w:space="0" w:color="93B4F0"/>';
        const table =
          "<w:tbl><w:tblPr>" +
          '<w:tblW w:w="' + contentW + '" w:type="dxa"/>' +
          '<w:jc w:val="center"/>' +
          "<w:tblBorders>" +
          ["top", "left", "bottom", "right", "insideH", "insideV"].map(border).join("") +
          "</w:tblBorders>" +
          '<w:tblLayout w:type="fixed"/>' +
          '<w:tblCellMar><w:top w:w="80" w:type="dxa"/><w:left w:w="100" w:type="dxa"/>' +
          '<w:bottom w:w="80" w:type="dxa"/><w:right w:w="100" w:type="dxa"/></w:tblCellMar>' +
          "</w:tblPr><w:tblGrid>" +
          widths.map((w) => '<w:gridCol w:w="' + w + '"/>').join("") +
          "</w:tblGrid>" +
          rows +
          "</w:tbl>";

        const body =
          wPara(clubName, { size: 36, bold: true, color: "1E3A8A", after: 80 }) +
          (periodName
            ? wPara(periodName, { size: 28, color: "5F7399", after: 240 })
            : '<w:p><w:pPr><w:spacing w:after="160"/></w:pPr></w:p>') +
          table +
          "<w:p/>" +
          "<w:sectPr>" +
          '<w:pgSz w:w="' + pageW + '" w:h="' + pageH + '"' + (landscape ? ' w:orient="landscape"' : "") + "/>" +
          '<w:pgMar w:top="' + margin + '" w:right="' + margin + '" w:bottom="' + margin +
          '" w:left="' + margin + '" w:header="708" w:footer="708" w:gutter="0"/>' +
          "</w:sectPr>";

        const hdr = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
        const files = [
          {
            name: "[Content_Types].xml",
            content:
              hdr +
              '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
              '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
              '<Default Extension="xml" ContentType="application/xml"/>' +
              '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
              "</Types>"
          },
          {
            name: "_rels/.rels",
            content:
              hdr +
              '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
              '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
              "</Relationships>"
          },
          {
            name: "word/_rels/document.xml.rels",
            content:
              hdr +
              '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>'
          },
          {
            name: "word/document.xml",
            content:
              hdr +
              '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>' +
              body +
              "</w:body></w:document>"
          }
        ];

        const blob = makeZip(files);
        const fileName =
          (clubName + (periodName ? " - " + periodName : "")).replace(/[\\/:*?"<>|]+/g, "").trim() + ".docx";
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
        showToast("Файл «" + fileName + "» готов", "success");
      } catch (e) {
        console.warn(e);
        showToast("Не удалось создать .docx", "error");
      }
    };

    applyAdminMode();
  </script>
</body>
</html>
